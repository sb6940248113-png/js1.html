<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คะแนนเทคบอล</title>                   
</head>
<body>
  <style>
    .team {
  font-size:100px:
  font-weight: bold;
}
    body {
      text-align: center;
      background: url('Teqball.jpg') no-repeat center center;
  background-size: cover;
      padding: 30px;
      font-family: sans-serif;
    }
    .container {
  max-width: 400px;
  margin: 0 auto;
  background: transparent;
}

.team {
  margin: 30px 0;
  padding: 25px;
  background: transparent;
  border-radius: 50px;
  color: white;
}
.score {
  font-size: 30px;
  font-weight: bold;
  color: #ffffff;
  text-shadow: 2px 2px 4px white(6, 2, 2, 0.5);
}

.set {
  font-size: 24px;
  color: rgb(167, 9, 9)
}

h1 {
  font-size: 36px;
  color: #ffd700;
  text-shadow: 2px 2px 4px rgba(224, 214, 214, 0.5);
}

button {
  font-size: 20px;
  padding: 10px 20px;
}
#result {
  color: white;  /
  background: transparent;
}
  </style>
    <div class="container">
    <h1>🏆 คะแนนเทคบอล</h1>
    <div class="team"></div>
    <h2>ทีม 1</h2>
     <p class="score" id="score1">0</p>
     <p class="set" id="set1">เซ็ต: 0</p>
     <button onclick="addScore(1)">+1 แต้ม</button>
     </div>
     <div class="team"></div>
     <h2>ทีม 2</h2>
     <p class="score" id="score2">0</p>
     <p class="set" id="set2">เซ็ต:0</p>
     <button onclick="addScore(2)">+1 แต้ม</button>
      </div>
      <button class="reset" onclick="resetGame()">🔄 เริ่มใหม่</button>
       <div id="result" class="result"></div>
    </div>
    <script>
     let score1 = 0, score2 = 0;
     let set1 = 0, set2 = 0;
     const WIN_SET = 11;
    const LEAD_GAP = 2;

function addScore(team){
    if (team === 1) score1++;
     else score2++;
           updateDisplay();
      checkSetWin();
   
}
function checkSetWin() {
  const res = document.getElementById('result');
  if ((score1 >= WIN_SET || score2 >= WIN_SET) && Math.abs(score1 - score2) >= LEAD_GAP) {
    if (score1 > score2) {
      set1++;
      res.textContent = '🎉 ทีม 1 ชนะเซ็ตนี้!';
    } else {
      set2++;
      res.textContent = '🎉 ทีม 2 ชนะเซ็ตนี้!';
    }
    setTimeout(resetSet, 2000);
  }

  if (set1 >= 2 || set2 >= 2) {
    res.innerHTML = `<strong>🏆 ${set1 >= 2 ? 'ทีม 1' : 'ทีม 2'} ชนะการแข่งขัน!</strong>`;
  }
}

function resetSet() {
  score1 = 0;
  score2 = 0;
  updateDisplay();
  document.getElementById('result').textContent = '';
}

function resetGame() {
  score1 = score2 = set1 = set2 = 0;
  updateDisplay();
  document.getElementById('result').textContent = '';
}

function updateDisplay() {
  document.getElementById('score1').textContent = score1;
  document.getElementById('score2').textContent = score2;
  document.getElementById('set1').textContent = 'เซ็ต: ' + set1;
  document.getElementById('set2').textContent = 'เซ็ต: ' + set2;
}

    </script>          
</body>
